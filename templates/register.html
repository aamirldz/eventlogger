{% extends "layout.html" %}

{% block title %}Staff Registration - EventPass QMS{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-6">
    <div class="card p-8 md:p-10 border-slate-700/80 shadow-2xl relative">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white mx-auto mb-3 shadow-lg shadow-blue-500/25">
                <i data-lucide="user-plus" class="w-6 h-6"></i>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Staff Account Request</h2>
            <p class="text-xs text-slate-400 mt-1">Register for gate verification scanner access. Subject to superadmin approval.</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="name" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Full Name</label>
                    <input type="text" id="name" name="name" class="w-full px-4 py-2.5 form-input text-sm" placeholder="e.g. Sarah Connor" required>
                </div>
                <div>
                    <label for="phone" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Phone Number</label>
                    <input type="tel" id="phone" name="phone" class="w-full px-4 py-2.5 form-input text-sm" placeholder="e.g. +1 555 123 4567" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="address" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Department / Assigned Gate</label>
                <input type="text" id="address" name="address" class="w-full px-4 py-2.5 form-input text-sm" placeholder="e.g. Gate Staff / CS Department" required>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Desired Username</label>
                    <input type="text" id="username" name="username" class="w-full px-4 py-2.5 form-input text-sm" placeholder="e.g. sarah" required>
                </div>
                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="password" name="password" class="w-full px-4 py-2.5 form-input text-sm" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="w-full btn btn-primary py-3 text-sm font-bold shadow-lg shadow-blue-500/25">
                Submit Staff Registration
            </button>
        </form>

        <p class="text-center text-xs text-slate-400 mt-6 pt-5 border-t border-slate-800">
            Already have an active account?
            <a href="{{ url_for('login') }}" class="font-bold text-blue-400 hover:text-blue-300 hover:underline ml-1">Sign In</a>
        </p>
    </div>
</div>
{% endblock %}
