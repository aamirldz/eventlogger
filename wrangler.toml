name = "eventlogger"
main = "src/index.js"
compatibility_date = "2024-04-03"

[vars]
BASE_URL = "https://eventlogger.faizanldz07.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "eventlogger-db"
database_id = "9747fa96-51d4-4fba-9450-187ed1e52a7d"

# Include templates as text modules
[[rules]]
type = "Text"
globs = ["templates/**/*.html"]
fallthrough = true

# Include CSS as text module
[[rules]]
type = "Text"
globs = ["static/**/*.css"]
fallthrough = true

[observability]
enabled = true
